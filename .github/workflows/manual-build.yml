name: Manual Docker Build

on:
  workflow_dispatch:
    inputs:
      kicad-version:
        description: 'KiCad Version'
        default: '9'
        required: false
      ergogen-stable-version:
        description: 'Ergogen Stable Version'
        default: '4.2.1'
        required: false
      ergogen-snapshot-url:
        description: 'Ergogen Snapshot URL'
        default: 'https://github.com/ceoloide/ergogen#v4.3.0'
        required: false
      freerouting-stable-version:
        description: 'Freerouting Stable Version'
        default: '2.5.0'
        required: false
      freerouting-snapshot-image:
        description: 'Freerouting Snapshot GHCR Image'
        default: 'ghcr.io/freerouting/freerouting:nightly@sha256:b7c4223089549082ba1ff1588858665690e652e27b5d230ddc1548de7d77fb6d'
        required: false
      freerouting-snapshot-url:
        description: 'Freerouting Snapshot URL (optional override)'
        default: ''
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run docker build script
        run: |
          chmod +x create_docker_image.sh
          ./create_docker_image.sh \
            --kicad-version=${{ github.event.inputs.kicad-version }} \
            --ergogen-stable-version=${{ github.event.inputs.ergogen-stable-version }} \
            --ergogen-snapshot-url=${{ github.event.inputs.ergogen-snapshot-url }} \
            --freerouting-stable-version=${{ github.event.inputs.freerouting-stable-version }} \
            --freerouting-snapshot-image=${{ github.event.inputs.freerouting-snapshot-image }} \
            --freerouting-snapshot-url=${{ github.event.inputs.freerouting-snapshot-url }} \
            --push
