name: Manual Docker Build

on:
  workflow_dispatch:
    inputs:
      kicad-versions:
        description: 'KiCad versions to build (space separated)'
        default: '9 10'
        required: false
      kicad9-base-tag:
        description: 'ghcr.io/inti-cmnb/kicad9_auto tag'
        default: '1.9.1-1_k9.0.7_d13.2'
        required: false
      kicad10-base-tag:
        description: 'ghcr.io/inti-cmnb/kicad10_auto tag'
        default: 'latest'
        required: false
      ergogen-stable-version:
        description: 'Ergogen Stable Version'
        default: '4.2.1'
        required: false
      ergogen-snapshot-url:
        description: 'Ergogen Snapshot URL (branches are pinned to their head commit)'
        default: 'https://github.com/ceoloide/ergogen#v4.3.0'
        required: false
      ergogen-snapshot-version:
        description: 'Ergogen Snapshot Version (tag label, the commit is appended)'
        default: '4.3.0'
        required: false
      freerouting-version:
        description: 'Freerouting Version'
        default: '2.6.0'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run docker build script
        env:
          KICAD_VERSIONS: ${{ github.event.inputs.kicad-versions }}
          KICAD9_BASE_TAG: ${{ github.event.inputs.kicad9-base-tag }}
          KICAD10_BASE_TAG: ${{ github.event.inputs.kicad10-base-tag }}
          ERGOGEN_STABLE_VERSION: ${{ github.event.inputs.ergogen-stable-version }}
          ERGOGEN_SNAPSHOT_URL: ${{ github.event.inputs.ergogen-snapshot-url }}
          ERGOGEN_SNAPSHOT_VERSION: ${{ github.event.inputs.ergogen-snapshot-version }}
          FREEROUTING_VERSION: ${{ github.event.inputs.freerouting-version }}
        run: |
          chmod +x create_docker_image.sh
          ./create_docker_image.sh \
            --kicad-versions="${KICAD_VERSIONS}" \
            --kicad9-base-tag="${KICAD9_BASE_TAG}" \
            --kicad10-base-tag="${KICAD10_BASE_TAG}" \
            --ergogen-stable-version="${ERGOGEN_STABLE_VERSION}" \
            --ergogen-snapshot-url="${ERGOGEN_SNAPSHOT_URL}" \
            --ergogen-snapshot-version="${ERGOGEN_SNAPSHOT_VERSION}" \
            --freerouting-version="${FREEROUTING_VERSION}" \
            --push
